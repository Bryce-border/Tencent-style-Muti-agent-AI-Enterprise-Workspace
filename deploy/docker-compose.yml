services:
  workspace:
    build:
      context: ../apps/workspace
    ports:
      - "8080:80"
    depends_on:
      - agent-runtime
    restart: unless-stopped

  agent-runtime:
    build:
      context: ../services/agent-runtime
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - runtime_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  agent-worker:
    build:
      context: ../services/agent-runtime
    env_file:
      - .env
    command: ["python", "-m", "app.worker"]
    volumes:
      - runtime_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: workspace
      RABBITMQ_DEFAULT_PASS: workspace
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-workspace}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-workspace-secret-change-me}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes: ["minio_data:/data"]
    ports: ["127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rabbitmq_data:
  elasticsearch_data:
  runtime_data:
  minio_data:
