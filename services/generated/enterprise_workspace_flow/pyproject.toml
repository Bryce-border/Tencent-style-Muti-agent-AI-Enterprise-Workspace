[project]
name = "enterprise_workspace_flow"
version = "0.1.0"
description = "enterprise_workspace_flow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]>=0.86.0,<1.0.0",
]

[project.scripts]
kickoff = "enterprise_workspace_flow.main:kickoff"
plot = "enterprise_workspace_flow.main:plot"
run_crew = "enterprise_workspace_flow.main:kickoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
